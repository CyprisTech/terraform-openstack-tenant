version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # The CodeQL actions (init, analyze, upload-sarif) must move together.
    groups:
      codeql:
        patterns: ["github/codeql-action*"]
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly
