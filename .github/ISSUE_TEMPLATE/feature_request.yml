name: Feature request
description: Propose a new capability or a change of behaviour
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it not possible or inconvenient today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would the input model or the behaviour change? An HCL sketch helps.
      render: hcl
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This concerns OpenStack resources, not operations (state, secrets, pipelines), which are out of scope (see docs/operations.md).
          required: true
