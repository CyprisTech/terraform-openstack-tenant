name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate (${{ matrix.tool }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest supported versions and latest, for both tools
          - { tool: tofu, version: "1.6.3" }
          - { tool: tofu, version: "latest" }
          - { tool: terraform, version: "1.6.6" }
          - { tool: terraform, version: "latest" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.version }}
          tofu_wrapper: false

      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.version }}
          terraform_wrapper: false

      - name: fmt
        run: ${{ matrix.tool }} fmt -check -recursive -diff

      - name: init
        run: ${{ matrix.tool }} init -backend=false -input=false

      - name: validate
        run: ${{ matrix.tool }} validate

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
      - run: tflint --init
      # Examples call modules that are not written yet (the specification
      # comes first), so only the root is linted for now. Switch to
      # --recursive and to --minimum-failure-severity=warning once the
      # building blocks exist.
      - run: tflint --format compact --minimum-failure-severity=error
      - name: tflint (modules, warnings fail)
        run: |
          for d in modules/*/; do
            echo "::group::$d"
            tflint --chdir="$d" --config="$PWD/.tflint.hcl" --format compact
            echo "::endgroup::"
          done

  test:
    name: test (${{ matrix.tool }}, mocked providers)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Mocked providers need OpenTofu >= 1.8 or Terraform >= 1.7.
        tool: [tofu, terraform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: matrix.tool == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: latest
          tofu_wrapper: false

      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false

      - run: ${{ matrix.tool }} init -backend=false -input=false
      - run: ${{ matrix.tool }} test

  docs:
    name: README reference up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: terraform-docs
        run: |
          curl -sSLo tfd.tgz https://github.com/terraform-docs/terraform-docs/releases/download/v0.24.0/terraform-docs-v0.24.0-linux-amd64.tar.gz
          tar xzf tfd.tgz terraform-docs && rm tfd.tgz
          ./terraform-docs .
          for d in modules/*/; do ./terraform-docs markdown table --indent 2 --output-file README.md --output-mode inject "$d"; done
          rm terraform-docs
          git diff --exit-code -- README.md modules/

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --no-banner --redact --verbose

  misconfig:
    name: trivy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          exit-code: "1"
          severity: HIGH,CRITICAL
